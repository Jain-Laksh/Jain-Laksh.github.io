<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B68EE" />
      <stop offset="50%" stop-color="#5BBEAD" />
      <stop offset="100%" stop-color="#F0A868" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2C3E" />
      <stop offset="100%" stop-color="#1A1A2E" />
    </linearGradient>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />

  <!-- Inner circle -->
  <circle cx="200" cy="200" r="175" fill="url(#cardGrad)" />

  <!-- Avatar body & head outline -->
  <g fill="#FFFFFF" opacity="0.92">
    <!-- Head -->
    <circle cx="200" cy="155" r="65" />
    <!-- Shoulders / Torso -->
    <path d="M100,320 C100,245 140,235 200,235 C260,235 300,245 300,320 Z" />
  </g>

  <!-- Glasses / Modern Scholar Accent -->
  <g stroke="#7B68EE" stroke-width="6" fill="none" opacity="0.95">
    <circle cx="175" cy="155" r="22" fill="rgba(123, 104, 238, 0.15)" />
    <circle cx="225" cy="155" r="22" fill="rgba(123, 104, 238, 0.15)" />
    <line x1="197" y1="155" x2="203" y2="155" />
    <line x1="153" y1="155" x2="140" y2="150" />
    <line x1="247" y1="155" x2="260" y2="150" />
  </g>

  <!-- Smile -->
  <path d="M185,185 Q200,195 215,185" stroke="#2C2C3E" stroke-width="4" stroke-linecap="round" fill="none" />
</svg>
